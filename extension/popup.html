<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>KeywordOn</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>KeywordOn</strong>
      <span>Advisor</span>
    </header>
    <label>
      키워드
      <input id="keyword" placeholder="분석할 키워드" />
    </label>
    <div class="actions">
      <button id="analyze">분석하기</button>
      <button id="sidepanel" class="ghost">사이드패널</button>
    </div>
    <p class="hint">네이버 검색 페이지에서는 검색어 배너도 표시됩니다.</p>
    <script src="popup.js"></script>
  </body>
</html>
